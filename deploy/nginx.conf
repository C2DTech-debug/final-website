# C2D Tech reverse proxy (nginx). Routes site traffic to the Next.js frontend
# and proxies API + docs straight to the backend. Media is served from
# Cloudinary CDN URLs, so no /uploads location is needed.
#
# Reference service in docker-compose.yml:
#   nginx:
#     image: nginx:1.27-alpine
#     restart: unless-stopped
#     ports:
#       - "80:80"
#       - "443:443"
#     volumes:
#       - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
#       - ./deploy/certs:/etc/nginx/certs:ro
#     depends_on:
#       - frontend
#       - backend

upstream frontend_app {
  server frontend:3000;
}

upstream backend_app {
  server backend:5000;
}

server {
  listen 80;
  server_name _;

  client_max_body_size 10m;

  # Gzip
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

  # API -> backend
  location /api/ {
    proxy_pass http://backend_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # API docs
  location = /api-docs {
    return 302 /api-docs/;
  }
  location /api-docs/ {
    proxy_pass http://backend_app;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Everything else -> Next.js frontend
  location / {
    proxy_pass http://frontend_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_cache_bypass $http_upgrade;
  }
}
