services:
  # ---------- Backend API + admin ----------
  # Cloud-only by design: MongoDB lives on Atlas (MONGODB_URI in backend/.env),
  # and every uploaded file is stored on Cloudinary (CLOUDINARY_* in
  # backend/.env). No data is persisted on the server's local disk.
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - CLIENT_URL=${CLIENT_URL:-http://localhost:3000}
      - NODE_ENV=production
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ---------- Frontend (Next.js) ----------
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://backend:5000}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
